title: Smoky Beef Chilli
description: A dark, thick chilli with properly browned mince, smoked paprika and a spoonful of cocoa for depth. It needs time rather than effort, and tastes even better reheated.
course: main
cuisine: tex-mex
tags: [chilli, batch-cooking, freezer-friendly, comfort-food, one-pot]
diet: [gluten-free, dairy-free, nut-free]
difficulty: easy
serves: 6
time: { prep: 15, cook: 95, rest: 10 }
ingredients:
  - section: Chilli
    items:
      - { qty: 2, unit: tbsp, item: vegetable oil, fixed: true }
      - { qty: 750, unit: g, item: beef mince, note: 12 to 15% fat }
      - { qty: 2, unit: null, item: onions, prep: finely chopped }
      - { qty: 2, unit: null, item: red peppers, prep: deseeded and diced }
      - { qty: 4, unit: clove, item: garlic, prep: finely chopped }
      - { qty: 1, unit: tbsp, item: smoked paprika }
      - { qty: 2, unit: tsp, item: ground cumin }
      - { qty: 1, qtyMax: 2, unit: tsp, item: hot chilli powder, key: chilli powder, note: to your taste }
      - { qty: 1, unit: tsp, item: dried oregano }
      - { qty: 0.5, unit: tsp, item: ground cinnamon }
      - { qty: 3, unit: tbsp, item: tomato puree }
      - { qty: 800, unit: g, item: chopped tomatoes, note: 2 tins }
      - { qty: 400, unit: ml, item: beef stock }
      - { qty: 1, unit: tbsp, item: cocoa powder, note: unsweetened }
      - { qty: 1.5, unit: tsp, item: fine salt, note: plus extra to taste }
      - { qty: 2, unit: can, item: kidney beans, prep: drained and rinsed, note: 400g tins }
      - { qty: 1, unit: null, item: lime, prep: juiced }
  - section: To serve
    items:
      - { qty: 400, unit: g, item: long-grain rice }
      - { qty: 1, unit: handful, item: fresh coriander, prep: roughly chopped }
steps:
  - text: Heat half the oil in a large casserole over a high heat. Add half the mince, press it into a flat layer and leave it without stirring until the underside is dark brown. Break it up, cook for a couple of minutes more, then tip into a bowl. Repeat with the remaining mince, without adding more oil.
    timer: { minutes: 10, label: Brown the mince }
    tip: Grey, steamed mince makes a flat-tasting chilli. Let it get genuinely brown and a bit crusty.
  - text: Turn the heat down to medium and add the remaining oil, the onions and the peppers with a pinch of salt. Cook, scraping up the browned bits, until soft.
    timer: { minutes: 8, label: Soften vegetables }
  - text: Add the garlic, smoked paprika, cumin, chilli powder, oregano and cinnamon and stir for a minute. Add the tomato puree and cook, stirring, for a minute more.
    timer: { minutes: 2, label: Toast spices }
  - text: Return the mince to the pan. Add the chopped tomatoes, stock, cocoa and salt and stir well. Bring to the boil, then turn the heat down low, part-cover with the lid and simmer, stirring occasionally.
    timer: { minutes: 45, label: Simmer }
  - text: Stir in the kidney beans and simmer with the lid off until the chilli is thick and glossy and a spoon dragged across the base leaves a trail. Meanwhile, cook the rice following the packet instructions.
    timer: { minutes: 25, label: Thicken with beans }
  - text: Take the chilli off the heat, stir in the lime juice and leave it to stand. Taste and adjust the salt and heat.
    timer: { minutes: 10, label: Rest }
  - text: Serve over the rice with the coriander scattered on top.
equipment: [large lidded casserole, saucepan for the rice, wooden spoon]
tips:
  - Start with 1 tsp of chilli powder if you are feeding children, and put hot sauce on the table for everyone else.
  - Make it a day ahead if you can. The flavours round out overnight in the fridge.
substitutions:
  - { for: kidney beans, use: black beans }
  - { for: cocoa powder, use: dark chocolate, note: "use 20g, and check it is dairy-free if that matters" }
  - { for: beef mince, use: pork mince or a half-and-half mix }
storage: Keeps for 4 days in the fridge or 3 months in the freezer, without the rice. Defrost fully and reheat until piping hot.
