title: Jollof Rice
description: Rice simmered in a blended tomato, pepper and onion base with spiced chicken until it has soaked up every bit of the sauce. A Nigerian classic, warming rather than heavy, with a Scotch bonnet for those who want the heat.
course: main
cuisine: nigerian
tags: [rice, chicken, one-pot, spicy, batch-cooking]
diet: [gluten-free]
difficulty: easy
serves: 6
yield: 6 to 8 large servings
time: { prep: 15, cook: 40, rest: 10 }
theme: { id: overwatch, style: doomfist }
ingredients:
  - section: Tomato base
    items:
      - { qty: 450, unit: g, item: tinned chopped tomatoes, key: chopped tomatoes, note: fire-roasted if you can find them }
      - { qty: 4, unit: clove, item: garlic }
      - { qty: 1, unit: null, item: red onion, prep: roughly chopped }
      - { qty: 1, unit: null, item: red pepper, prep: "deseeded and roughly chopped" }
      - { qty: 1, unit: null, item: Scotch bonnet chilli, key: chilli, optional: true }
  - section: Chicken
    items:
      - { qty: 30, unit: g, item: unsalted butter, key: butter }
      - { qty: 60, unit: ml, item: groundnut oil }
      - { qty: 1, unit: tsp, item: curry powder }
      - { qty: 0.5, unit: tsp, item: dried thyme }
      - { qty: 0.5, unit: tsp, item: ground ginger }
      - { qty: 1, unit: tsp, item: paprika }
      - { qty: 2, qtyMax: 3, unit: null, item: chicken breasts, key: chicken breast, prep: diced }
  - section: Rice
    items:
      - { qty: 120, unit: g, item: tomato puree }
      - { qty: 400, unit: g, item: long-grain white rice, key: long-grain rice }
      - { qty: 600, unit: ml, item: chicken stock, key: stock }
steps:
  - text: Put the tomatoes, garlic, onion, red pepper and the Scotch bonnet, if you are using it, in a food processor. Pulse until everything is finely chopped and saucy, then set aside.
    tip: Leave the Scotch bonnet out for a mild pot, or use half with the seeds removed for a gentler heat.
  - text: Warm the butter and oil together in a frying pan over a medium heat. Once the butter has melted, stir in the curry powder, thyme, ginger and paprika, then add the chicken. Keep it moving until the pieces are browned all over.
    timer: { minutes: 6, label: Brown chicken }
  - text: Tip the chicken and its spiced oil into a large saucepan. Add the blended tomato base, tomato puree, rice and stock and stir well. Bring to the boil, stirring now and then so the rice does not catch on the bottom.
  - text: Turn the heat down to low, cover with a tight lid and cook until the rice is tender and the liquid has been absorbed.
    timer: { minutes: 20, label: Simmer rice }
  - text: Take the pan off the heat and leave it to stand with the lid on, so the rice finishes steaming.
    timer: { minutes: 10, label: Rest }
  - text: Fluff the rice with a fork and serve hot.
equipment: [food processor, frying pan, large saucepan with a lid]
tips:
  - Check the stock is gluten-free if that matters to you; many stock cubes are not.
substitutions:
  - { for: groundnut oil, use: vegetable oil, note: also makes it safe for anyone avoiding peanuts }
  - { for: chicken breasts, use: boneless chicken thighs }
storage: Keeps for 3 days in the fridge. Cool quickly, and reheat until piping hot with a splash of water.
cover: { hue: 14, motif: grain }
author: "Adapted from Overwatch: The Official Cookbook"
created: 2026-10-09
