title: Ginger Pork Noodles
description: Pork mince fried until crisp at the edges, tossed with egg noodles, greens and a punchy soy and ginger sauce. A fast stir-fry where the prep takes longer than the cooking.
course: main
cuisine: chinese
tags: [stir-fry, noodles, weeknight, quick, pork]
diet: [dairy-free, nut-free]
difficulty: easy
serves: 2
time: { prep: 15, cook: 12 }
ingredients:
  - section: Sauce
    items:
      - { qty: 2, unit: tbsp, item: light soy sauce }
      - { qty: 1, unit: tbsp, item: oyster sauce }
      - { qty: 1, unit: tbsp, item: rice vinegar }
      - { qty: 1, unit: tsp, item: soft brown sugar }
      - { qty: 1, unit: tsp, item: cornflour }
      - { qty: 3, unit: tbsp, item: cold water }
  - section: Stir-fry
    items:
      - { qty: 150, unit: g, item: dried egg noodles, key: egg noodles }
      - { qty: 1, unit: tsp, item: toasted sesame oil }
      - { qty: 1, unit: tbsp, item: vegetable oil, fixed: true }
      - { qty: 250, unit: g, item: pork mince }
      - { qty: 25, unit: g, item: fresh ginger, prep: peeled and cut into fine matchsticks }
      - { qty: 3, unit: clove, item: garlic, prep: finely chopped }
      - { qty: 4, unit: null, item: spring onions, prep: "sliced, whites and greens kept separate" }
      - { qty: 1, unit: null, item: red chilli, prep: finely sliced, optional: true }
      - { qty: 1, unit: null, item: carrot, prep: cut into thin matchsticks }
      - { qty: 2, unit: null, item: pak choi, prep: "stems sliced, leaves left whole" }
steps:
  - text: Stir the sauce ingredients together in a small bowl until the cornflour has dissolved. Prepare all the vegetables and have everything within reach of the hob, because nothing waits once the cooking starts.
  - text: Cook the noodles in boiling water following the packet timing, until just tender. Drain, rinse briefly under cold water to stop them cooking, then toss with the sesame oil so they do not stick together.
    timer: { minutes: 4, label: Noodles }
  - text: Heat a wok or large frying pan over a high heat until very hot, then add the vegetable oil. Add the pork, press it out into a thin layer and leave it without stirring until the underside is browned and crisp.
    timer: { minutes: 3, label: Sear pork }
    tip: Resist the urge to stir straight away. Mince that is kept moving releases its liquid and stews.
  - text: Break the pork into small pieces and keep frying until it is cooked through with crisp, golden edges.
    timer: { minutes: 3, label: Crisp pork }
  - text: Add the ginger, garlic, spring onion whites and the chilli if using. Stir-fry for 30 seconds, then add the carrot and pak choi stems and stir-fry until just starting to soften.
    timer: { minutes: 2, label: Vegetables }
  - text: Add the noodles and pak choi leaves. Give the sauce a stir, pour it in and toss everything over the heat until the leaves have wilted and the sauce coats the noodles.
    timer: { minutes: 2, label: Toss with sauce }
  - text: Divide between warm bowls and scatter with the spring onion greens.
equipment: [wok or large frying pan, saucepan, colander, tongs]
tips:
  - This quantity suits a standard wok. To serve four, cook it in two batches rather than doubling it in one pan, which would steam everything.
substitutions:
  - { for: pork mince, use: chicken or turkey mince }
  - { for: pak choi, use: shredded green cabbage or tenderstem broccoli }
  - { for: egg noodles, use: flat rice noodles, note: soak or cook following the packet instructions }
storage: Keeps for 2 days in the fridge. Reheat in a hot pan with a splash of water until piping hot.
nutrition: { kcal: 680, protein: 34, carbs: 62, fat: 31, fibre: 5 }
