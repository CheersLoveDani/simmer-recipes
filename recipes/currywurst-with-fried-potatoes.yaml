title: Currywurst with Fried Potatoes
description: Browned sausages sliced into a warm, sweet-sharp curry ketchup, with crisp fried potatoes to drag through the sauce. Berlin street food, sized for a knight.
course: main
cuisine: german
tags: [street-food, sausages, comfort-food, weeknight]
diet: [dairy-free, nut-free]
difficulty: easy
serves: 2
time: { prep: 10, cook: 30 }
theme: { id: overwatch, style: reinhardt }
ingredients:
  - section: Potatoes
    items:
      - { qty: 500, unit: g, item: waxy potatoes, key: potato, prep: cut into 2 cm chunks }
      - { qty: 2, unit: tbsp, item: vegetable oil }
      - { qty: 0.5, unit: tsp, item: fine salt, key: salt }
  - section: Curry sauce
    items:
      - { qty: 1, unit: tbsp, item: vegetable oil }
      - { qty: 1, unit: null, item: onion, prep: finely chopped }
      - { qty: 1, unit: tbsp, item: mild curry powder, key: curry powder }
      - { qty: 1, unit: tsp, item: sweet paprika, key: paprika }
      - { qty: 150, unit: g, item: tomato ketchup, key: ketchup }
      - { qty: 150, unit: g, item: passata }
      - { qty: 1, unit: tbsp, item: cider vinegar }
      - { qty: 1, unit: tsp, item: soft brown sugar, key: brown sugar }
      - { qty: 1, unit: tsp, item: Worcestershire sauce }
  - section: To serve
    items:
      - { qty: 4, unit: null, item: pork sausages, key: sausages }
      - { qty: 1, unit: tsp, item: mild curry powder, key: curry powder, note: for dusting }
steps:
  - text: Put the potatoes in a pan of cold salted water, bring to the boil and simmer until a knife goes in with a little resistance. Drain well and leave to steam dry in the colander.
    timer: { minutes: 6, label: Parboil potatoes }
  - text: For the sauce, heat the oil in a small saucepan over a medium heat and cook the onion until soft and pale gold.
    timer: { minutes: 6, label: Soften onion }
  - text: Stir in the curry powder and paprika and cook for 30 seconds, until fragrant. Add the ketchup, passata, vinegar, sugar and Worcestershire sauce, then simmer gently until thick and glossy. Blend until smooth if you like.
    timer: { minutes: 10, label: Simmer sauce }
    tip: Frying the spices briefly in the oil takes away their raw, dusty edge.
  - text: Meanwhile, heat the oil for the potatoes in a large frying pan over a medium-high heat. Add the potatoes in a single layer with the salt and fry, turning only now and then, until deeply golden and crisp.
    timer: { minutes: 12, label: Fry potatoes }
  - text: In a second pan, fry the sausages over a medium heat, turning often, until browned all over and cooked through.
    timer: { minutes: 12, label: Sausages }
  - text: Slice the sausages into thick coins, spoon over plenty of warm sauce and dust with the extra curry powder. Serve with the potatoes alongside.
equipment: [two frying pans, small saucepan, colander]
tips:
  - Bratwurst is the classic choice if you can find it. Any coarse, well-seasoned pork sausage works.
substitutions:
  - { for: pork sausages, use: vegetarian sausages }
  - { for: fried potatoes, use: a crusty bread roll }
storage: The sauce keeps for 5 days in the fridge and is better the next day. Reheat gently.
cover: { hue: 18, motif: flame }
