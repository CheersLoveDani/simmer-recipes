title: Brigadeiros
description: Brazilian chocolate fudge truffles made from condensed milk, cocoa and butter, cooked until thick, then rolled and coated. Soft, chewy and gone before the track ends.
course: dessert
cuisine: brazilian
tags: [chocolate, sweets, party, make-ahead, no-bake]
diet: [vegetarian, gluten-free, nut-free]
difficulty: easy
serves: 10
yield: about 20 truffles
time: { prep: 20, cook: 12, rest: 60 }
theme: { id: overwatch, style: lucio }
ingredients:
  - section: null
    items:
      - { qty: 397, unit: g, item: sweetened condensed milk, key: condensed milk, note: 1 tin }
      - { qty: 30, unit: g, item: cocoa powder, prep: sifted }
      - { qty: 25, unit: g, item: unsalted butter, key: butter, note: plus extra for greasing }
      - { qty: 1, unit: pinch, item: fine salt, key: salt }
  - section: To coat
    items:
      - { qty: 40, unit: g, item: desiccated coconut }
      - { qty: 2, unit: tbsp, item: cocoa powder }
steps:
  - text: Lightly butter a shallow dish. Put the condensed milk, cocoa, butter and salt in a heavy-based non-stick saucepan and stir until there are no dry pockets of cocoa.
  - text: Set the pan over a medium-low heat and cook, stirring all the time and scraping the base and corners, until the mixture is thick and glossy. It is ready when a spoon dragged across the base leaves a clear trail that takes a couple of seconds to close.
    timer: { minutes: 10, label: Cook fudge }
    tip: Do not walk away. Condensed milk catches and scorches quickly once it thickens.
  - text: Scrape the mixture into the buttered dish, press cling film or baking paper onto the surface and leave to cool, then chill until firm enough to roll.
    timer: { minutes: 60, label: Chill }
  - text: Put the coconut and the extra cocoa in two shallow bowls. Butter your palms, scoop out heaped teaspoons of the mixture and roll them into balls.
  - text: Roll half the balls in coconut and half in cocoa. Set them in small paper cases if you have them and serve at room temperature.
equipment: [non-stick saucepan, silicone spatula, shallow dish]
tips:
  - If the mixture is too soft to roll after chilling, it was not cooked for long enough. Return it to the pan for a few more minutes.
substitutions:
  - { for: desiccated coconut, use: chocolate sprinkles, note: the traditional coating }
storage: Keep in an airtight container for 3 days at cool room temperature, or a week in the fridge.
cover: { hue: 100, motif: berry }
