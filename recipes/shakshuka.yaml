title: Shakshuka
description: Eggs poached in a thick, smoky tomato and pepper sauce until the whites are set and the yolks still run. Bring the pan to the table and mop it up with bread.
course: breakfast
cuisine: middle-eastern
tags: [eggs, brunch, one-pan, tomato, vegetarian]
diet: [vegetarian, nut-free]
difficulty: easy
serves: 2
time: { prep: 10, cook: 30 }
ingredients:
  - items:
      - { qty: 2, unit: tbsp, item: olive oil }
      - { qty: 1, unit: null, item: onion, prep: thinly sliced }
      - { qty: 1, unit: null, item: red pepper, prep: deseeded and thinly sliced }
      - { qty: 3, unit: clove, item: garlic, prep: thinly sliced }
      - { qty: 1, unit: tsp, item: ground cumin }
      - { qty: 1, unit: tsp, item: sweet paprika }
      - { qty: 0.5, unit: tsp, item: smoked paprika }
      - { qty: 1, unit: pinch, item: chilli flakes, note: more if you like heat }
      - { qty: 1, unit: tbsp, item: tomato puree }
      - { qty: 400, unit: g, item: chopped tomatoes, note: 1 tin }
      - { qty: 100, unit: ml, item: water }
      - { qty: 0.5, unit: tsp, item: caster sugar }
      - { qty: 0.5, unit: tsp, item: fine salt, note: plus extra to taste }
      - { qty: 4, unit: null, item: eggs }
      - { qty: 50, unit: g, item: feta, prep: crumbled }
      - { qty: 1, unit: handful, item: fresh coriander, prep: roughly chopped }
      - { qty: 4, unit: slice, item: crusty bread, prep: toasted, note: to serve }
steps:
  - text: Heat the oil in a frying pan about 24cm wide over a medium heat. Add the onion and pepper with a pinch of salt and cook, stirring now and then, until very soft and starting to colour.
    timer: { minutes: 10, label: Soften onion and pepper }
  - text: Add the garlic, cumin, both paprikas and the chilli flakes and stir for a minute until fragrant. Stir in the tomato puree.
    timer: { minutes: 1, label: Spices }
  - text: Pour in the chopped tomatoes and water, then add the sugar and salt. Simmer, stirring occasionally, until the sauce is thick enough that a spoon dragged through it leaves a clear trail. Taste and adjust the seasoning now, before the eggs go in.
    timer: { minutes: 10, label: Reduce sauce }
    tip: A thin sauce will not hold the eggs in place, so keep going until it is properly thick.
  - text: Turn the heat down to low. Make four wells in the sauce with the back of a spoon and crack an egg into each. Season the eggs with a little salt.
    tip: Crack each egg into a cup first if you are worried about shell or a broken yolk.
  - text: Cover the pan and cook gently until the whites are just set and the yolks still wobble. Start checking after 5 minutes, as the eggs carry on cooking once off the heat.
    timer: { minutes: 6, label: Poach eggs }
  - text: Scatter with the feta and coriander and serve straight from the pan with the toasted bread.
equipment: [24cm frying pan with a lid, wooden spoon]
tips:
  - No lid for your pan? A baking tray or a large plate laid over the top does the job.
  - To serve four, double everything and use a 30cm pan so the eggs have room.
substitutions:
  - { for: feta, use: thick yoghurt, note: add a spoonful on top at the end }
  - { for: coriander, use: flat-leaf parsley }
  - { for: chilli flakes, use: harissa, note: stir 1 to 2 tsp in with the tomato puree }
storage: The sauce keeps for 4 days in the fridge without the eggs. Reheat it until bubbling, then add fresh eggs.
nutrition: { kcal: 520, protein: 25, carbs: 38, fat: 30, fibre: 7 }
