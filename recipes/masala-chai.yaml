title: Masala Chai
description: Strong black tea simmered with fresh ginger, cardamom, cinnamon, cloves and peppercorns, then boiled up with milk until creamy and fragrant. Warming, spicy and as sweet as you like it.
course: drink
cuisine: indian
tags: [tea, spiced, warming, hot-drink, quick]
diet: [vegetarian, gluten-free, nut-free]
difficulty: easy
serves: 2
yield: 2 mugs
time: { prep: 5, cook: 12 }
ingredients:
  - items:
      - { qty: 6, unit: null, item: cardamom pods, note: green }
      - { qty: 4, unit: null, item: whole cloves }
      - { qty: 4, unit: null, item: black peppercorns }
      - { qty: 1, unit: null, item: cinnamon stick, note: "small, about 5cm" }
      - { qty: 15, unit: g, item: fresh ginger, prep: unpeeled and thinly sliced, note: a thumb-sized piece }
      - { qty: 300, unit: ml, item: water }
      - { qty: 1, unit: tbsp, item: black tea, note: "loose-leaf Assam, or 3 strong tea bags" }
      - { qty: 300, unit: ml, item: whole milk }
      - { qty: 2, qtyMax: 4, unit: tsp, item: sugar, note: to taste }
steps:
  - text: Lightly crush the cardamom pods, cloves and peppercorns with a pestle and mortar or the base of a heavy pan, just enough to split the pods open. Snap the cinnamon stick in half.
  - text: Put the crushed spices, cinnamon, ginger and water in a small saucepan. Bring to the boil, then turn the heat down and simmer gently for 5 minutes so the spices infuse the water.
    timer: { minutes: 5, label: Simmer spices }
  - text: Add the tea and simmer for 2 minutes, until the liquid is a deep reddish brown.
    timer: { minutes: 2, label: Brew tea }
    tip: Do not leave the tea much longer at this stage or the chai will turn bitter and tannic.
  - text: Pour in the milk and bring back up to the boil, watching closely as it will rise up the pan quickly. Lower the heat and simmer for 3 minutes, stirring now and then, until the chai is the colour of caramel.
    timer: { minutes: 3, label: Simmer with milk }
    tip: Letting it rise and then lifting the pan off the heat two or three times gives a richer, creamier cup.
  - text: Stir in sugar to taste, then strain through a fine sieve or tea strainer into two mugs. Serve straight away.
equipment: [small saucepan, pestle and mortar, fine sieve or tea strainer]
tips:
  - A little sugar is traditional and rounds out the spices; even if you normally take tea unsweetened, try a teaspoon.
  - Use a strong, malty tea such as Assam. Delicate teas like Darjeeling or Earl Grey are lost against the milk and spice.
substitutions:
  - { for: whole milk, use: oat milk, note: "heat gently and do not boil hard, as it can split" }
  - { for: sugar, use: honey or jaggery, note: stir honey in off the heat }
  - { for: fresh ginger, use: 0.5 tsp ground ginger }
storage: Best drunk fresh. The strained chai keeps in the fridge for 2 days; reheat gently or pour it over ice.
