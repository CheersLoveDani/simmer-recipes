title: Overnight Oats
description: Oats soaked overnight in milk and yoghurt until soft and creamy, with chia seeds for body and a little maple syrup. Five minutes in the evening, breakfast ready when you wake.
course: breakfast
cuisine: british
tags: [make-ahead, no-cook, meal-prep, quick, oats]
diet: [vegetarian, nut-free]
difficulty: easy
serves: 2
time: { prep: 5, cook: 0, rest: 480 }
ingredients:
  - section: Oats
    items:
      - { qty: 100, unit: g, item: rolled oats }
      - { qty: 1, unit: tbsp, item: chia seeds }
      - { qty: 200, unit: ml, item: milk }
      - { qty: 100, unit: g, item: natural yoghurt, key: yoghurt }
      - { qty: 1, unit: tbsp, item: maple syrup, note: plus extra to serve }
      - { qty: 0.5, unit: tsp, item: vanilla extract }
      - { qty: 1, unit: pinch, item: salt }
  - section: To serve
    items:
      - { qty: 100, unit: g, item: blueberries }
steps:
  - text: Put the oats, chia seeds and salt in a bowl or divide them between two jars. Add the milk, yoghurt, maple syrup and vanilla and stir well, scraping the bottom so no dry pockets of oats or clumps of chia are left.
    tip: Stir again after 5 minutes if you can. Chia seeds clump as they start to swell and a second stir keeps the texture even.
  - text: Cover and chill overnight. The oats will absorb most of the liquid and the mixture will set to a thick, spoonable consistency.
    timer: { minutes: 480, label: Soak in fridge }
  - text: In the morning, stir and loosen with a splash of milk if it is thicker than you like. Top with the blueberries and a little more maple syrup.
equipment: [mixing bowl or 2 lidded jars]
tips:
  - Use rolled (porridge) oats, not jumbo or instant. Jumbo oats stay chewy and instant oats turn to paste.
  - In a hurry, 2 hours in the fridge is enough for the oats to soften, though the texture is better after a full night.
substitutions:
  - { for: milk and yoghurt, use: 300 ml oat or soya milk, note: makes it dairy-free and vegan; the result is slightly looser }
  - { for: blueberries, use: grated apple or sliced banana, note: add banana in the morning so it does not brown }
  - { for: maple syrup, use: honey }
storage: Keeps covered in the fridge for up to 3 days. Add fresh fruit just before eating.
nutrition: { kcal: 370, protein: 14, carbs: 52, fat: 10, fibre: 8 }
cover: { hue: 265, motif: bowl }
