title: Kimchi Fried Rice
description: Yesterday's rice fried hard with ripe, sour kimchi and a spoonful of gochujang until sticky and crisp at the edges, then topped with a lacy fried egg.
course: main
cuisine: korean
tags: [quick, leftovers, spicy, rice, weeknight]
diet: [pescatarian, dairy-free, nut-free]
difficulty: easy
serves: 2
time: { prep: 10, cook: 15 }
ingredients:
  - items:
      - { qty: 2, unit: tbsp, item: vegetable oil, fixed: true }
      - { qty: 3, unit: null, item: spring onions, prep: "thinly sliced, white and green parts kept separate" }
      - { qty: 2, unit: clove, item: garlic, prep: finely chopped }
      - { qty: 200, unit: g, item: kimchi, prep: roughly chopped, note: plus 2 tbsp juice from the jar }
      - { qty: 1, unit: tbsp, item: gochujang }
      - { qty: 400, unit: g, item: cooked short-grain rice, key: sushi rice, note: "chilled; from about 180 g uncooked" }
      - { qty: 1, unit: tbsp, item: soy sauce }
      - { qty: 2, unit: tsp, item: toasted sesame oil }
      - { qty: 2, unit: null, item: eggs }
      - { qty: 1, unit: tsp, item: sesame seeds, note: toasted }
      - { qty: 1, unit: null, item: nori sheets, key: nori, prep: snipped into thin strips, optional: true }
steps:
  - text: Break up the cold rice with damp fingers so there are no large clumps. Have everything else chopped and measured before you start, as this cooks quickly.
  - text: Heat 1 tbsp of the oil in a large frying pan or wok over a medium-high heat. Add the spring onion whites and garlic and stir-fry for 30 seconds until fragrant.
  - text: Add the kimchi and fry, stirring now and then, until it has darkened a shade and is starting to caramelise at the edges.
    timer: { minutes: 5, label: Fry kimchi }
    tip: Do not cut this short. Cooking the kimchi down is what gives the rice its deep, rounded flavour rather than just sourness.
  - text: Stir in the gochujang and kimchi juice, then add the rice. Turn the heat to high and stir-fry, pressing the rice into the pan and turning it over, until every grain is stained red and piping hot.
    timer: { minutes: 4, label: Fry rice }
  - text: Add the soy sauce and sesame oil and toss well. Press the rice into an even layer and leave it untouched for a minute so the base crisps, then take off the heat.
    timer: { minutes: 1, label: Crisp the base }
  - text: Heat the remaining oil in a small frying pan over a medium-high heat and fry the eggs until the whites are set with frilly brown edges and the yolks are still runny, 2–3 minutes.
  - text: Divide the rice between two bowls, top each with an egg and scatter over the spring onion greens, sesame seeds and nori. Break the yolk into the rice as you eat.
equipment: [large frying pan or wok, small frying pan]
tips:
  - Use the oldest, sourest kimchi you have. Fresh kimchi is too mild and crunchy to stand up to frying.
  - Cool freshly cooked rice quickly, chill it within an hour and use it within a day. Warm, just-cooked rice turns to mush in the pan.
  - Most kimchi is made with fish sauce or salted shrimp. Look for a vegan one if you are cooking for vegetarians.
substitutions:
  - { for: gochujang, use: 1 tsp chilli flakes and 1 tsp miso }
  - { for: short-grain rice, use: jasmine or long-grain rice, note: "the result is a little less sticky" }
storage: Eat straight away. Do not keep or reheat leftovers, as the rice has already been cooled and reheated once.
