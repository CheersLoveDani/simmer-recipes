title: Maple Pecan Granola
description: Crisp, clumpy granola baked low and slow with maple syrup, toasted pecans and a warm note of cinnamon. Left to cool untouched on the tray, it breaks into proper clusters.
course: breakfast
cuisine: american
tags: [make-ahead, batch-cooking, oats, baking, meal-prep]
diet: [vegetarian, vegan, dairy-free]
difficulty: easy
serves: 12
yield: about 700 g
time: { prep: 10, cook: 35, rest: 45 }
ingredients:
  - section: Dry
    items:
      - { qty: 300, unit: g, item: rolled oats }
      - { qty: 150, unit: g, item: pecans, prep: roughly broken }
      - { qty: 50, unit: g, item: pumpkin seeds }
      - { qty: 1, unit: tsp, item: ground cinnamon, key: cinnamon }
      - { qty: 0.5, unit: tsp, item: fine salt, key: salt }
  - section: Wet
    items:
      - { qty: 120, unit: ml, item: maple syrup }
      - { qty: 60, unit: ml, item: olive oil, note: a mild one }
      - { qty: 1, unit: tsp, item: vanilla extract }
  - section: After baking
    items:
      - { qty: 80, unit: g, item: raisins, optional: true }
steps:
  - text: Heat the oven to 160°C (140°C fan). Line a large, rimmed baking tray with baking paper.
  - text: Mix the oats, pecans, pumpkin seeds, cinnamon and salt in a large bowl. Whisk the maple syrup, oil and vanilla together in a jug, pour over the dry ingredients and stir thoroughly until every oat looks damp and glossy.
  - text: Tip onto the tray and spread into an even layer about 1 cm deep, then press it down firmly with the back of a spoon so it is compacted.
    tip: Pressing the mixture down is what makes clusters. Loose granola bakes into separate flakes.
  - text: Bake for 20 minutes, then turn the tray around. Gently turn the granola over in large sections with a fish slice, bringing the darker edges into the middle, and press it flat again.
    timer: { minutes: 20, label: First bake }
  - text: Bake for a further 12–15 minutes until evenly golden brown and smelling toasty. It will still feel soft when hot; it crisps as it cools.
    timer: { minutes: 15, label: Second bake }
    tip: Go by colour, not texture. Pull it out when it is the shade of a digestive biscuit; maple syrup turns bitter quickly once it goes past that.
  - text: Leave to cool completely on the tray without stirring. Once cold and hard, break into clusters with your hands and mix in the raisins, if using.
    timer: { minutes: 45, label: Cool on tray }
equipment: [large rimmed baking tray, baking paper, large mixing bowl, measuring jug]
tips:
  - Never bake the dried fruit. It scorches and turns hard, so always add it once the granola is cold.
  - If your tray is small, use two. A layer much deeper than 1 cm steams and stays chewy in the middle.
substitutions:
  - { for: pecans, use: walnuts or whole almonds, note: roughly chopped }
  - { for: olive oil, use: melted coconut oil or sunflower oil }
  - { for: raisins, use: chopped dried apricots or dates }
storage: Keep in an airtight jar at room temperature for up to 3 weeks. If it softens, re-crisp on a tray at 150°C (130°C fan) for 5 minutes and cool again.
