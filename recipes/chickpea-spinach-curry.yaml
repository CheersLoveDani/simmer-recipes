title: Chickpea and Spinach Curry
description: A gently spiced, coconut-rich curry built from tins and a bag of spinach. Crushing a few of the chickpeas into the sauce makes it thick and velvety without any cream.
course: main
cuisine: indian
tags: [curry, vegan, storecupboard, weeknight, one-pot, budget]
diet: [vegan, vegetarian, gluten-free, dairy-free]
difficulty: easy
serves: 4
time: { prep: 10, cook: 35 }
ingredients:
  - section: Curry
    items:
      - { qty: 2, unit: tbsp, item: vegetable oil }
      - { qty: 1, unit: null, item: onion, prep: finely chopped, note: large }
      - { qty: 4, unit: clove, item: garlic, prep: finely grated }
      - { qty: 20, unit: g, item: fresh ginger, prep: finely grated, note: a thumb-sized piece }
      - { qty: 1, unit: null, item: green chilli, prep: finely chopped }
      - { qty: 2, unit: tsp, item: ground cumin }
      - { qty: 2, unit: tsp, item: ground coriander }
      - { qty: 1, unit: tsp, item: ground turmeric }
      - { qty: 0.5, unit: tsp, item: chilli powder }
      - { qty: 400, unit: g, item: chopped tomatoes, note: 1 tin }
      - { qty: 2, unit: can, item: chickpeas, prep: drained and rinsed, note: 400g tins }
      - { qty: 400, unit: ml, item: coconut milk, note: 1 tin }
      - { qty: 1, unit: tsp, item: fine salt, note: plus extra to taste }
      - { qty: 200, unit: g, item: baby spinach }
      - { qty: 1, unit: tsp, item: garam masala }
      - { qty: 0.5, unit: null, item: lemon, prep: juiced }
  - section: To serve
    items:
      - { qty: 300, unit: g, item: basmati rice }
      - { qty: 1, unit: handful, item: fresh coriander, prep: roughly chopped }
steps:
  - text: Heat the oil in a large, deep pan over a medium heat. Add the onion with a pinch of salt and cook, stirring often, until soft and golden at the edges.
    timer: { minutes: 9, label: Soften onion }
    tip: Do not rush this. Properly golden onions give the sauce its sweetness and body.
  - text: Stir in the garlic, ginger and green chilli and cook until fragrant. Add the cumin, ground coriander, turmeric and chilli powder and stir for 30 seconds more, adding a splash of water if the spices start to catch.
    timer: { minutes: 2, label: Aromatics }
  - text: Tip in the chopped tomatoes and cook, stirring, until they have thickened into a paste and the oil starts to show around the edges.
    timer: { minutes: 5, label: Cook tomatoes }
  - text: Add the chickpeas, coconut milk and salt. Bring to a simmer and cook uncovered, stirring now and then, until the sauce has thickened. Meanwhile, cook the rice following the packet instructions.
    timer: { minutes: 15, label: Simmer curry }
  - text: Crush roughly a quarter of the chickpeas against the side of the pan with the back of a spoon and stir them in to thicken the sauce.
  - text: Add the spinach a handful at a time, stirring until each addition wilts, then stir in the garam masala and cook briefly.
    timer: { minutes: 2, label: Wilt spinach }
  - text: Take off the heat, stir in the lemon juice, then taste and adjust the salt. Serve over the rice, scattered with coriander.
equipment: [large deep pan, saucepan for the rice, fine grater]
tips:
  - Garam masala goes in at the end so its aromatic spices stay bright rather than cooking out.
  - If the curry gets too thick, loosen it with a splash of water. It should be spoonable, not stiff.
substitutions:
  - { for: baby spinach, use: frozen spinach, note: "use 250g, add from frozen and simmer for 5 minutes" }
  - { for: chickpeas, use: butter beans }
  - { for: basmati rice, use: naan or flatbreads, note: the dish is then no longer gluten-free }
storage: Keeps for 4 days in the fridge and freezes well for 3 months, without the rice. Reheat until piping hot, adding a splash of water.
nutrition: { kcal: 620, protein: 19, carbs: 80, fat: 25, fibre: 11 }
