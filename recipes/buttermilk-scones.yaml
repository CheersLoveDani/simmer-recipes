title: Buttermilk Scones
description: Tall, tender scones with a soft crumb and a faint tang from the buttermilk, on the table in half an hour. A light hand and a hot oven are all they ask for.
course: baking
cuisine: british
tags: [scones, afternoon-tea, quick, teatime, classic]
diet: [vegetarian, nut-free]
difficulty: easy
serves: 8
yield: 8 scones
time: { prep: 15, cook: 14 }
ingredients:
  - section: Scones
    items:
      - { qty: 350, unit: g, item: self-raising flour, note: plus extra for dusting }
      - { qty: 1, unit: tsp, item: baking powder }
      - { qty: 0.25, unit: tsp, item: fine salt }
      - { qty: 85, unit: g, item: unsalted butter, prep: cold and cubed }
      - { qty: 40, unit: g, item: caster sugar }
      - { qty: 180, unit: ml, item: buttermilk, note: cold from the fridge }
      - { qty: 1, unit: null, item: egg, prep: beaten, note: to glaze, fixed: true }
  - section: To serve
    items:
      - { qty: null, unit: null, item: strawberry jam, note: to serve, optional: true }
      - { qty: null, unit: null, item: clotted cream, note: to serve, optional: true }
steps:
  - text: Heat the oven to 220°C (200°C fan) and put a large baking tray inside to heat up.
    tip: A hot tray gives the scones an immediate burst of heat from below, which helps them rise straight up.
  - text: Sift the flour, baking powder and salt into a large bowl. Add the butter and rub it in with your fingertips until the mixture looks like fine breadcrumbs with a few pea-sized pieces left. Stir in the sugar.
  - text: Make a well in the middle and pour in the buttermilk. Mix quickly with a table knife, cutting through the mixture, until it just comes together into a soft, slightly sticky dough. If dry flour remains in the bottom of the bowl, add another tablespoon of buttermilk.
    tip: Stop mixing the moment it holds together. Every extra stir develops gluten and makes for a tougher scone.
  - text: Tip the dough onto a lightly floured worktop and fold it over on itself two or three times until it is just smooth. Pat it out with your hands to a round about 3cm thick; do not use a rolling pin.
  - text: Dip a 6cm round cutter in flour and stamp out the scones, pressing straight down without twisting. Gently press the trimmings together and cut again; you should get 8 in total.
    tip: Twisting the cutter seals the edges and the scones will rise lopsided.
  - text: Brush just the tops with beaten egg, keeping it off the sides. Arrange on the hot tray and bake for 12–15 minutes, until well risen and golden.
    timer: { minutes: 13, label: Bake scones }
  - text: Cool on a wire rack for a few minutes. Serve warm or at room temperature, split by hand, with jam and clotted cream.
equipment: [large baking tray, large mixing bowl, sieve, 6cm round cutter, pastry brush, wire rack]
tips:
  - Keep the butter and buttermilk cold and work fast, so the butter stays in small pieces until it reaches the oven.
  - Scones are at their best within a few hours of baking. Day-old ones revive well after 5 minutes in a 160°C oven.
substitutions:
  - { for: buttermilk, use: 170ml whole milk mixed with 2 tsp lemon juice, note: leave to stand for 5 minutes until slightly thickened }
  - { for: clotted cream, use: lightly whipped double cream }
  - { for: caster sugar, use: 75g sultanas as well as the sugar, note: stirred in before the buttermilk for fruit scones }
storage: Best eaten on the day. Freeze once cooled for up to 3 months, then defrost and warm through in the oven.
