title: Tarka Dal
description: Red lentils simmered with turmeric until they fall apart, then woken up with a sizzling pan of cumin, mustard seeds, garlic and chilli poured over at the last moment.
course: main
cuisine: indian
tags: [weeknight, budget, lentils, comfort]
diet: [vegan, vegetarian, gluten-free, dairy-free, nut-free]
difficulty: easy
serves: 4
time: { prep: 10, cook: 30 }
ingredients:
  - section: Dal
    items:
      - { qty: 300, unit: g, item: red lentils, prep: rinsed until the water runs clear }
      - { qty: 1.1, unit: l, item: water }
      - { qty: 1, unit: tsp, item: ground turmeric }
      - { qty: 2, unit: null, item: tomatoes, prep: roughly chopped }
      - { qty: 1, unit: tsp, item: fine salt, note: plus more to taste }
  - section: Tarka
    items:
      - { qty: 3, unit: tbsp, item: vegetable oil }
      - { qty: 1.5, unit: tsp, item: cumin seeds }
      - { qty: 1, unit: tsp, item: mustard seeds }
      - { qty: 1, unit: null, item: onion, prep: halved and thinly sliced }
      - { qty: 4, unit: clove, item: garlic, prep: thinly sliced }
      - { qty: 20, unit: g, item: fresh ginger, prep: peeled and finely grated }
      - { qty: 2, unit: null, item: green chillies, key: chilli, prep: slit lengthways }
      - { qty: 0.5, unit: tsp, item: chilli powder }
      - { qty: 1, unit: tsp, item: garam masala }
  - section: To finish
    items:
      - { qty: 1, unit: handful, item: fresh coriander, prep: roughly chopped }
      - { qty: 0.5, unit: null, item: lemon, prep: juiced }
steps:
  - text: Put the rinsed lentils in a large saucepan with the water and turmeric. Bring to the boil, skim off the foam that rises, then turn the heat down to a steady simmer.
  - text: Simmer with the lid ajar, stirring now and then, until the lentils have completely broken down. Add the tomatoes and salt for the final 10 minutes.
    timer: { minutes: 25, label: Simmer lentils }
    tip: Give it a hard whisk at the end for a smooth, creamy dal. Loosen with a splash of boiling water if it is thicker than you like.
  - text: While the lentils finish, heat the oil in a frying pan over a medium-high heat. Add the cumin and mustard seeds and let them sizzle until the mustard seeds start to pop, about 30 seconds.
  - text: Add the onion and fry, stirring often, until deep golden at the edges.
    timer: { minutes: 8, label: Fry onion }
  - text: Add the garlic, ginger and green chillies and fry for 2 minutes until the garlic is pale gold. Take the pan off the heat and stir in the chilli powder and garam masala.
    tip: Ground spices scorch in seconds, which is why they go in off the heat.
  - text: Tip most of the tarka, oil and all, into the lentils and stir it through. Squeeze in the lemon juice, taste and add more salt if needed.
  - text: Spoon into bowls and top with the remaining tarka and the coriander. Serve with rice or flatbreads.
equipment: [large saucepan, frying pan, whisk]
tips:
  - Dal thickens a lot as it sits. Always loosen leftovers with water when reheating.
  - Slitting the chillies rather than chopping them gives fragrance with gentle heat. Chop them if you want it fiery.
substitutions:
  - { for: vegetable oil, use: ghee, note: "traditional, but no longer vegan or dairy-free" }
  - { for: tomatoes, use: 200 g tinned chopped tomatoes }
  - { for: mustard seeds, use: extra cumin seeds }
storage: Keeps for 4 days in the fridge or 3 months in the freezer. Reheat gently with a splash of water until piping hot.
