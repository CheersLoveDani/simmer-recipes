title: Potato Rösti
description: Coarsely grated potato pressed into a butter-crisp cake, golden outside and tender within. The Swiss answer to almost everything, and restorative after a long shift.
course: side
cuisine: swiss
tags: [potatoes, brunch, crispy, one-pan]
diet: [vegetarian, gluten-free, nut-free]
difficulty: medium
serves: 2
time: { prep: 15, cook: 25 }
theme: { id: overwatch, style: mercy }
ingredients:
  - section: null
    items:
      - { qty: 600, unit: g, item: waxy potatoes, key: potato, prep: peeled }
      - { qty: 0.75, unit: tsp, item: fine salt, key: salt }
      - { qty: 1, unit: pinch, item: black pepper }
      - { qty: 1, unit: pinch, item: grated nutmeg, key: nutmeg, optional: true }
      - { qty: 40, unit: g, item: unsalted butter, key: butter }
      - { qty: 1, unit: tbsp, item: vegetable oil }
  - section: To serve
    items:
      - { qty: 2, unit: null, item: eggs, key: egg, prep: fried, optional: true }
      - { qty: 1, unit: tbsp, item: chives, prep: finely snipped }
steps:
  - text: Grate the potatoes on the coarse side of a box grater. Pile them into a clean tea towel, gather it up and twist hard over the sink to wring out as much liquid as you can.
    tip: This is what makes the rösti crisp. Wet potato steams and turns grey and gluey.
  - text: Tip the potato into a bowl and toss with the salt, pepper and nutmeg.
  - text: Heat half the butter with the oil in a 20 cm non-stick frying pan over a medium heat. When the butter foams, add the potato, spread it out and press down lightly into an even cake. Cook without moving it until the underside is deep golden and the edges are crisp.
    timer: { minutes: 12, label: First side }
  - text: Loosen the edges, put a plate over the pan and turn the two over together so the rösti lands cooked side up. Melt the remaining butter in the pan, slide the rösti back in and cook the second side until golden and the potato is tender all the way through.
    timer: { minutes: 10, label: Second side }
  - text: Slide onto a board, cut into wedges and scatter with the chives. Top with fried eggs if you like.
equipment: [box grater, 20 cm non-stick frying pan, clean tea towel, plate for turning]
tips:
  - Keep the heat at medium. Too high and the outside burns before the middle is cooked.
substitutions:
  - { for: butter, use: olive oil, note: for a dairy-free rösti }
storage: Best eaten straight from the pan. Leftovers reheat in a dry frying pan until crisp again.
cover: { hue: 48, motif: slice }
