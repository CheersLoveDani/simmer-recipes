title: Thai Green Chicken Curry
description: Fragrant, creamy and as fiery as your curry paste allows, with tender chicken thighs and vegetables that keep their bite. On the table in the time it takes to cook the rice.
course: main
cuisine: thai
tags: [curry, weeknight, quick, spicy, coconut]
diet: [gluten-free, dairy-free]
difficulty: easy
serves: 4
time: { prep: 15, cook: 25 }
ingredients:
  - section: Curry
    items:
      - { qty: 1, unit: tbsp, item: vegetable oil, fixed: true }
      - { qty: 3, qtyMax: 4, unit: tbsp, item: thai green curry paste, note: depending on its heat }
      - { qty: 400, unit: ml, item: coconut milk, note: "1 tin, full-fat, unshaken" }
      - { qty: 600, unit: g, item: boneless chicken thighs, prep: "skinless, cut into bite-sized pieces" }
      - { qty: 150, unit: ml, item: chicken stock }
      - { qty: 1, unit: tbsp, item: fish sauce, note: plus extra to taste }
      - { qty: 2, unit: tsp, item: light brown sugar }
      - { qty: 150, unit: g, item: green beans, prep: trimmed and halved }
      - { qty: 1, unit: null, item: courgette, prep: cut into half-moons }
      - { qty: 1, unit: null, item: lime, prep: juiced }
      - { qty: 1, unit: handful, item: basil leaves, note: Thai basil if you can find it }
      - { qty: 1, unit: null, item: red chilli, prep: thinly sliced, optional: true }
  - section: Rice
    items:
      - { qty: 300, unit: g, item: jasmine rice }
      - { qty: 450, unit: ml, item: cold water }
steps:
  - text: Rinse the rice in a sieve until the water runs mostly clear. Put it in a saucepan with the measured water and a pinch of salt, bring to the boil, then cover with a tight lid and turn the heat to its lowest setting.
    timer: { minutes: 12, label: Rice }
  - text: Take the rice off the heat and leave it to steam with the lid on while you finish the curry. Do not lift the lid.
    timer: { minutes: 10, label: Steam rice }
  - text: While the rice cooks, heat the oil in a wok or deep frying pan over a medium heat. Spoon in the thick cream from the top of the coconut milk tin along with the curry paste. Fry, stirring, until it smells fragrant and the oil starts to separate at the edges.
    timer: { minutes: 3, label: Fry the paste }
    tip: Start with 3 tbsp of paste if you do not know the brand. You can stir in more later, but you cannot take it out.
  - text: Add the chicken and stir to coat it in the paste. Pour in the rest of the coconut milk and the stock, then add the fish sauce and sugar. Bring to a gentle simmer and cook, uncovered.
    timer: { minutes: 8, label: Simmer chicken }
  - text: Add the green beans and courgette and simmer until the vegetables are just tender and the chicken is cooked through with no pink in the middle.
    timer: { minutes: 6, label: Cook vegetables }
  - text: Take the pan off the heat. Stir in the lime juice and most of the basil, then taste. It should be salty, sour, sweet and hot all at once, so add a little more fish sauce, lime or sugar until it is.
  - text: Fluff the rice with a fork and serve the curry alongside, topped with the remaining basil and the sliced chilli if using.
equipment: [wok or deep frying pan, lidded saucepan, sieve]
tips:
  - Keep the curry at a gentle simmer. A hard boil toughens the chicken and can make the coconut milk split.
  - Shop-bought pastes vary a lot in salt and heat, which is why the final tasting matters more than the measurements.
substitutions:
  - { for: chicken thighs, use: raw king prawns, note: "add them with the vegetables, they need only 3 to 4 minutes" }
  - { for: courgette, use: aubergine, note: "cut into 2cm cubes and add with the chicken" }
  - { for: fish sauce, use: light soy sauce, note: the dish is then no longer gluten-free }
storage: Keeps for 3 days in the fridge. Reheat gently until piping hot. Cool leftover rice quickly, refrigerate within an hour and eat within a day.
nutrition: { kcal: 680, protein: 36, carbs: 68, fat: 28, fibre: 4 }
cover: { hue: 95, motif: bowl }
