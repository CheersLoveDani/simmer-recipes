title: Chicken Noodle Soup
description: Chicken thighs poached on the bone in a broth of carrot, celery and thyme, shredded back in with fine egg noodles, parsley and a squeeze of lemon. Restorative in the plainest sense.
course: soup
cuisine: american
tags: [comfort, one-pot, winter, family, chicken]
diet: [dairy-free, nut-free]
difficulty: easy
serves: 4
time: { prep: 15, cook: 45 }
ingredients:
  - items:
      - { qty: 1, unit: tbsp, item: olive oil }
      - { qty: 1, unit: null, item: onion, prep: finely chopped }
      - { qty: 2, unit: null, item: carrots, prep: peeled and sliced into thin rounds }
      - { qty: 2, unit: null, item: celery sticks, prep: thinly sliced }
      - { qty: 2, unit: clove, item: garlic, prep: finely chopped }
      - { qty: 600, unit: g, item: bone-in chicken thighs, prep: skin removed, note: about 4 }
      - { qty: 1.5, unit: l, item: chicken stock }
      - { qty: 3, unit: sprig, item: thyme }
      - { qty: 1, unit: null, item: bay leaf, fixed: true }
      - { qty: 120, unit: g, item: fine egg noodles, key: egg noodles }
      - { qty: 15, unit: g, item: flat-leaf parsley, prep: finely chopped }
      - { qty: 0.5, unit: null, item: lemon, prep: juiced }
      - { qty: null, unit: null, item: salt, note: to taste }
      - { qty: null, unit: null, item: black pepper, note: to taste }
steps:
  - text: Heat the oil in a large saucepan over a medium heat. Add the onion, carrots and celery with a pinch of salt and cook gently, stirring now and then, until softened but not coloured.
    timer: { minutes: 8, label: Soften vegetables }
  - text: Stir in the garlic and cook for 1 minute. Nestle in the chicken thighs, then add the stock, thyme and bay leaf.
  - text: Bring just to the boil, skim off any foam, then turn the heat right down, cover with the lid ajar and simmer very gently until the chicken is cooked through and pulls easily from the bone.
    timer: { minutes: 30, label: Poach chicken }
    tip: Keep it at a lazy simmer. A hard boil turns the broth cloudy and the meat stringy.
  - text: Lift the chicken onto a board. Fish out and discard the thyme stalks and bay leaf. Shred the meat with two forks and throw away the bones.
  - text: Bring the broth back to a simmer, add the noodles and cook until just tender, usually 3–4 minutes — check the packet.
    timer: { minutes: 4, label: Cook noodles }
  - text: Return the chicken to the pan and warm through for a minute. Stir in the parsley and lemon juice, then season with salt and plenty of black pepper before ladling into warm bowls.
equipment: [large saucepan with lid, two forks]
tips:
  - If you are making this ahead, cook the noodles separately and add them to each bowl. Left sitting in the soup they drink the broth and go soft.
substitutions:
  - { for: bone-in chicken thighs, use: 300 g leftover roast chicken, note: "add with the noodles and simmer the broth for only 15 minutes" }
  - { for: egg noodles, use: broken spaghetti or small soup pasta, note: "allow a few minutes longer" }
storage: Keeps for 3 days in the fridge, ideally with noodles stored separately. Freeze without noodles for up to 3 months and reheat until piping hot.
nutrition: { kcal: 330, protein: 30, carbs: 28, fat: 10, fibre: 3 }
