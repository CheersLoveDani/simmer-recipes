title: Cheesy Frankfurter and Cajun Chicken Pasta Bake
description: Short pasta baked in tomato sauce with soft onions, Cajun-spiced chicken, browned frankfurter coins and tangy gherkins, under a blanket of bubbling cheese. A hearty store-cupboard bake with a gentle kick.
course: main
cuisine: european
tags: [weeknight, comfort-food, kid-friendly, budget, family]
diet: [nut-free]
difficulty: easy
serves: 4
time: { prep: 10, cook: 35 }
ingredients:
  - section: null
    items:
      - { qty: 350, unit: g, item: short pasta, key: penne, note: "penne, fusilli or similar" }
      - { qty: 1, unit: tbsp, item: vegetable oil }
      - { qty: 2, unit: null, item: cooked Cajun chicken breasts, key: chicken breast, prep: cut into bite-sized pieces, note: ready-cooked from the chilled aisle }
      - { qty: 1, unit: null, item: onion, prep: finely chopped }
      - { qty: 4, unit: null, item: frankfurters, prep: sliced into coins }
      - { qty: 500, unit: g, item: pasta sauce, note: about 1 large jar }
      - { qty: 4, unit: null, item: gherkins, prep: chopped }
      - { qty: 2, unit: null, item: spring onions, key: spring onion, prep: thinly sliced }
      - { qty: 150, unit: g, item: cheddar, prep: grated }
      - { qty: null, unit: null, item: salt, note: for the pasta water }
      - { qty: null, unit: null, item: black pepper, note: to taste }
prep:
  - text: Cut the chicken into bite-sized pieces.
  - text: Finely chop the onion.
    during: 1
  - text: Slice the frankfurters into coins.
    during: 1
  - text: Chop the gherkins.
    during: 1
  - text: Grate the cheese.
    during: 1
  - text: Thinly slice the spring onions.
    during: 1
steps:
  - text: Heat the oven to 200°C (180°C fan). Have ready a baking dish of about 2 litres, roughly 20 x 30cm.
  - text: Bring a large pan of salted water to the boil and cook the pasta for 2 minutes less than the packet says, so it stays firm in the oven.
    timer: { minutes: 8, label: Pasta }
    tip: Save a mug of the cooking water before draining.
  - text: Meanwhile, heat the oil in a large frying pan over a medium heat and cook the onion until soft and lightly golden.
    timer: { minutes: 5, label: Soften onion }
  - text: Add the frankfurter coins and fry, stirring now and then, until browned at the edges.
    timer: { minutes: 3, label: Brown frankfurters }
  - text: Pour in the pasta sauce, add the chicken, stir in most of the gherkins and simmer until bubbling and hot through.
    timer: { minutes: 3, label: Simmer sauce }
  - text: Drain the pasta and stir it into the sauce with a splash of the cooking water, so it stays saucy in the oven. Season with pepper and stir in a third of the cheese.
  - text: Tip everything into the baking dish, spread it level and scatter over the rest of the cheese.
  - text: Bake until the cheese is melted, golden and bubbling at the edges.
    timer: { minutes: 20, label: Bake }
  - text: Leave to stand for a few minutes, then serve topped with the spring onions and the remaining gherkins.
equipment: [large saucepan, large frying pan, colander, 2 litre baking dish]
tips:
  - The frankfurters and chicken are already cooked, so they only need heating through. Brown the frankfurters for flavour.
  - Cooked Cajun chicken varies in heat. For children, check the pack or swap half for plain cooked chicken.
  - For an extra-crispy top, finish the bake under a hot grill for 2–3 minutes.
substitutions:
  - { for: frankfurters, use: smoked sausage, note: slice and brown in the same way }
  - { for: cooked Cajun chicken breasts, use: leftover roast chicken, note: toss with 2 tsp Cajun seasoning }
  - { for: cheddar, use: mozzarella, note: stretchier and milder }
  - { for: pasta sauce, use: passata, note: "add a pinch of salt, sugar and dried herbs" }
storage: Keeps for 2 days in the fridge or 2 months in the freezer. See meal prep below for portioning and reheating.
nutrition: { kcal: 830, protein: 50, carbs: 82, fat: 33, fibre: 6 }
mealPrep:
  rating: great
  fridgeDays: 2
  freezerMonths: 2
  portion: Leave the bake to stand for 10 minutes so it firms up, then cut it into 4 and lift each portion into a lidded container or foil tray that can go in the microwave or oven, about 450 g each. Or keep the whole dish together for a family meal.
  freeze: Cool uncovered, then lid, label with the name and date and freeze within 2 hours of cooking. Lay portions flat so they chill quickly and stack neatly.
  defrost: Move a portion to the fridge the night before and eat it within 24 hours. Never defrost on the worktop.
  reheat:
    - method: microwave
      from: chilled
      minutes: 4
      text: Add a splash of water, cover loosely and heat on full for 3 to 4 minutes, stirring halfway, until steaming hot in the middle.
    - method: oven
      from: chilled
      minutes: 25
      text: Cover with foil and bake at 180°C (160°C fan) for 20 minutes, then uncover for 5 minutes to crisp the cheese.
    - method: air-fryer
      from: chilled
      minutes: 12
      text: In a small foil tray covered with foil, at 160°C for 8 to 10 minutes, then uncovered for 2 to 3 minutes.
    - method: oven
      from: frozen
      minutes: 50
      text: Cover with foil and bake at 180°C (160°C fan) for 45 to 50 minutes, uncovering for the last 10, until hot in the centre.
    - method: microwave
      from: frozen
      minutes: 10
      text: Defrost setting for 5 to 6 minutes, stir, then full power for 3 to 4 minutes with a splash of water, until steaming hot.
  serveFresh:
    - spring onions
    - gherkins
  tips:
    - "Cooking only to freeze? Stop after step 7: cool the unbaked bake, cover and freeze. Bake from frozen, covered, at 180°C (160°C fan) for about an hour, uncovering for the last 15 minutes."
    - The pasta is cooked 2 minutes short, so it keeps its bite when reheated. It drinks up sauce as it sits, so add a spoonful of water before reheating.
    - Fridge time counts from the day you cook it. If the chicken or frankfurters have an earlier use-by date, go by that.
    - Reheat each portion once only, until steaming hot all the way through.
