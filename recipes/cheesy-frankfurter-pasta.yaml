title: Cheesy Frankfurter Pasta
description: Short pasta tossed in jarred tomato sauce with soft onions and browned frankfurter coins, finished with tangy gherkins, fresh spring onions and a blanket of melted cheese. A store-cupboard dinner in about 20 minutes.
course: main
cuisine: european
tags: [weeknight, comfort-food, quick, kid-friendly, budget]
diet: [nut-free]
difficulty: easy
serves: 2
time: { prep: 5, cook: 15 }
ingredients:
  - section: null
    items:
      - { qty: 200, unit: g, item: short pasta, key: penne, note: "penne, fusilli or similar" }
      - { qty: 1, unit: tbsp, item: vegetable oil }
      - { qty: 1, unit: null, item: onion, prep: finely chopped }
      - { qty: 4, unit: null, item: frankfurters, prep: sliced into coins }
      - { qty: 350, unit: g, item: pasta sauce, note: about 1 jar }
      - { qty: 3, unit: null, item: gherkins, prep: chopped }
      - { qty: 2, unit: null, item: spring onions, key: spring onion, prep: thinly sliced }
      - { qty: 60, unit: g, item: cheddar, prep: grated }
      - { qty: null, unit: null, item: salt, note: for the pasta water }
      - { qty: null, unit: null, item: black pepper, note: to taste }
prep:
  - text: Finely chop the onion.
  - text: Slice the frankfurters into coins.
    during: 1
  - text: Chop the gherkins.
    during: 1
  - text: Grate the cheese.
    during: 1
  - text: Thinly slice the spring onions.
    during: 1
steps:
  - text: Bring a large pan of salted water to the boil and cook the pasta until just tender.
    timer: { minutes: 10, label: Pasta }
    tip: Use this time for the rest of the prep. Save a mug of the cooking water before draining.
  - text: Meanwhile, heat the oil in a large frying pan over a medium heat and cook the onion until soft and lightly golden.
    timer: { minutes: 5, label: Soften onion }
  - text: Add the frankfurter coins and fry, stirring now and then, until browned at the edges.
    timer: { minutes: 3, label: Brown frankfurters }
  - text: Pour in the pasta sauce, stir in most of the gherkins and simmer gently until bubbling and hot through.
    timer: { minutes: 3, label: Simmer sauce }
  - text: Drain the pasta and tip it into the sauce. Toss well, loosening with a splash of the cooking water if it looks thick, then season with pepper.
  - text: Take the pan off the heat, scatter over the cheese and cover with a lid until it melts.
    timer: { minutes: 2, label: Melt cheese }
  - text: Serve topped with the spring onions and the remaining gherkins.
equipment: [large saucepan, large frying pan with a lid, colander]
tips:
  - Frankfurters are already cooked, so you only need to brown and heat them through.
  - For a crispy top, put the pasta in an ovenproof dish, cover with the cheese and grill until bubbling.
substitutions:
  - { for: frankfurters, use: vegetarian hot dogs, note: makes it vegetarian if the cheese is too }
  - { for: cheddar, use: mozzarella, note: stretchier and milder }
  - { for: pasta sauce, use: passata, note: "add a pinch of salt, sugar and dried herbs" }
storage: Keeps for 2 days in the fridge. Reheat with a splash of water.
